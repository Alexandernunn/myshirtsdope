[build]
  command = "npm run build:netlify"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # SITE_URL is the intentionally public storefront origin used for CORS.
  # It appears in canonical URLs, robots.txt, and generated sitemap output.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com https: data:; connect-src 'self' https://graph.facebook.com https://www.facebook.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://*.netlify.app https:; frame-src 'self' https://www.facebook.com; frame-ancestors 'none'"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/cart"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/order-confirmation"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/start"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/product/:handle/"
  to = "/product/:handle"
  status = 301
  force = true

[[redirects]]
  from = "/product/:handle"
  to = "/product/:handle.html"
  status = 200
  force = true

[[redirects]]
  from = "/product/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/webhooks/shopify/catalog"
  to = "/.netlify/functions/shopify-catalog-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/cart"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/order-confirmation"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/start"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
